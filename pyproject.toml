[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "meteroid"
version = "0.27.1"
description = "Official Python SDK for Meteroid, the open-source billing platform: subscriptions, invoicing, usage-based billing and webhooks."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Meteroid", email = "hey@meteroid.com" }]
keywords = ["meteroid", "billing", "subscriptions", "invoicing", "usage-based-billing", "metering", "pricing", "webhooks", "api", "sdk"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/meteroid-oss/meteroid-python"
Homepage = "https://meteroid.com"
Documentation = "https://docs.meteroid.com"
Issues = "https://github.com/meteroid-oss/meteroid-python/issues"

[project.optional-dependencies]
dev = ["mypy>=1.18", "pytest>=8", "ruff==0.14.10"]

[tool.hatch.build.targets.wheel]
packages = ["meteroid"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
